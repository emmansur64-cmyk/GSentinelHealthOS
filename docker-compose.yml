services:
  # ============ INFRAESTRUCTURA ============

  redis-master:
    image: redis:7-alpine
    container_name: sentinel-redis-master
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_master_data:/data
      - ./broker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--bind", "0.0.0.0", "--protected-mode", "no"]
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    container_name: sentinel-redis-replica-1
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_replica1_data:/data
      - ./broker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    container_name: sentinel-redis-replica-2
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis_replica2_data:/data
      - ./broker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: sentinel-redis-sentinel-1
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "127.0.0.1:26379:26379"
    volumes:
      - ./broker/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    command: ["sh", "-c", "cp /usr/local/etc/redis/sentinel.conf /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: sentinel-redis-sentinel-2
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "127.0.0.1:26380:26379"
    volumes:
      - ./broker/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    command: ["sh", "-c", "cp /usr/local/etc/redis/sentinel.conf /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: sentinel-redis-sentinel-3
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "127.0.0.1:26381:26379"
    volumes:
      - ./broker/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    command: ["sh", "-c", "cp /usr/local/etc/redis/sentinel.conf /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis separado para cache (no cola crítica)
  redis-cache:
    image: redis:7-alpine
    container_name: sentinel-redis-cache
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_cache_data:/data
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis separado para métricas/eventos de observabilidad
  redis-metrics:
    image: redis:7-alpine
    container_name: sentinel-redis-metrics
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "127.0.0.1:6381:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_metrics_data:/data
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Monitoreo básico de colas críticas y latencia Redis
  redis-monitor:
    image: redis:7-alpine
    container_name: sentinel-redis-monitor
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      redis-master:
        condition: service_healthy
    environment:
      DLQ_ALERT_THRESHOLD: ${DLQ_ALERT_THRESHOLD:-50}
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          TS=$$(date '+%Y-%m-%dT%H:%M:%S%z');
          IN_LEN=$$(redis-cli -h redis-master -p 6379 LLEN whatsapp:incoming 2>/dev/null || echo -1);
          OUT_LEN=$$(redis-cli -h redis-master -p 6379 LLEN whatsapp:outgoing 2>/dev/null || echo -1);
          DLQ_LEN=$$(redis-cli -h redis-master -p 6379 LLEN whatsapp:outgoing:dead 2>/dev/null || echo -1);
          LAT=$$(redis-cli -h redis-master -p 6379 LATENCY LATEST 2>/dev/null | tr '\n' ' ');
          echo "[$$TS] queue_len incoming=$$IN_LEN outgoing=$$OUT_LEN dlq=$$DLQ_LEN";
          echo "[$$TS] redis_latency $$LAT";
          if [ "$$DLQ_LEN" -gt "$$DLQ_ALERT_THRESHOLD" ]; then
            echo "[$$TS] CRITICAL dlq_threshold_exceeded dlq=$$DLQ_LEN threshold=$$DLQ_ALERT_THRESHOLD";
          fi;
          sleep 10;
        done
    networks:
      - sentinel-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: sentinel_health
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============ APLICACIONES ============
  
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinel-api
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_QUEUE_PREFIX: "queue:"
      REDIS_STATE_PREFIX: "state:"
      REDIS_CACHE_PREFIX: "cache:"
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      BRAIN_API_KEY: ${BRAIN_API_KEY}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_EMBEDDED_SIGNUP_CONFIGURATION_ID: ${META_EMBEDDED_SIGNUP_CONFIGURATION_ID:-}
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./brain:/app/brain
      - ./MetaBrain:/app/MetaBrain
      - ./shared:/app/shared
    networks:
      - sentinel-network
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload

  booking-worker-0:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinel-booking-worker-0
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_QUEUE_PREFIX: "queue:"
      REDIS_STATE_PREFIX: "state:"
      REDIS_CACHE_PREFIX: "cache:"
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      BRAIN_API_KEY: ${BRAIN_API_KEY}
      BOOKING_QUEUE_SHARDS: 2
      BOOKING_WORKER_SHARD: 0
      BOOKING_QUEUE_RESULT_TTL_SECONDS: 86400
      BOOKING_QUEUE_LOCK_TTL_MS: 15000
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./brain:/app/brain
      - ./MetaBrain:/app/MetaBrain
      - ./shared:/app/shared
    networks:
      - sentinel-network
    command: python -m api.app.booking_queue_worker_main
    healthcheck:
      disable: true

  booking-worker-1:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinel-booking-worker-1
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_QUEUE_PREFIX: "queue:"
      REDIS_STATE_PREFIX: "state:"
      REDIS_CACHE_PREFIX: "cache:"
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      BRAIN_API_KEY: ${BRAIN_API_KEY}
      BOOKING_QUEUE_SHARDS: 2
      BOOKING_WORKER_SHARD: 1
      BOOKING_QUEUE_RESULT_TTL_SECONDS: 86400
      BOOKING_QUEUE_LOCK_TTL_MS: 15000
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./brain:/app/brain
      - ./MetaBrain:/app/MetaBrain
      - ./shared:/app/shared
    networks:
      - sentinel-network
    command: python -m api.app.booking_queue_worker_main
    healthcheck:
      disable: true

  outbox-scheduler:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sentinel-outbox-scheduler
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_QUEUE_PREFIX: "queue:"
      REDIS_STATE_PREFIX: "state:"
      REDIS_CACHE_PREFIX: "cache:"
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      BRAIN_API_KEY: ${BRAIN_API_KEY}
      OUTBOX_PROCESS_LIMIT: 200
      OUTBOX_SCHEDULER_INTERVAL_SECONDS: 15
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./brain:/app/brain
      - ./MetaBrain:/app/MetaBrain
      - ./shared:/app/shared
      - ./scripts:/app/scripts
    networks:
      - sentinel-network
    command: python scripts/run_outbox_scheduler.py
    healthcheck:
      disable: true

  brain:
    build:
      context: .
      dockerfile: docker/brain.Dockerfile
    container_name: sentinel-brain
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_QUEUE_PREFIX: "queue:"
      REDIS_STATE_PREFIX: "state:"
      REDIS_CACHE_PREFIX: "cache:"
      API_BASE_URL: http://api:8000
      BRAIN_API_KEY: brain-secret-key-change-production
      BRAIN_MODE: http
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: 8001
      INTERNAL_SERVICES_KEY: ${INTERNAL_SERVICES_KEY:-}
      DIALOGUE_ENGINE_URL: http://dialogue-engine:8010
      INFERENCE_SERVICE_URL: http://inference-service:8011
      DECISION_SERVICE_URL: http://decision-service:8012
      NLG_SERVICE_URL: http://nlg-service:8013
      ENV: production
    depends_on:
      - redis-master
      - redis-sentinel-1
      - postgres
    volumes:
      - ./brain:/app/brain
      - ./MetaBrain:/app/MetaBrain
      - ./shared:/app/shared
    networks:
      - sentinel-network
    command: python brain/main.py
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============ MICROSERVICIOS DE IA ============
  # Configuración base para todos los servicios de IA.
  # Cada servicio puede tener su propio Dockerfile/imagen en producción.

  dialogue-engine:
    # Reemplazar 'image' por 'build' cuando el servicio esté disponible localmente
    image: ${DIALOGUE_ENGINE_IMAGE:-sentinel-dialogue-engine:latest}
    container_name: sentinel-dialogue-engine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      REDIS_URL: redis://redis-master:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_METRICS_URL: redis://redis-metrics:6379
      INTERNAL_SERVICES_KEY: ${INTERNAL_SERVICES_KEY:-}
      ENV: production
    depends_on:
      - redis-master
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  inference-service:
    image: ${INFERENCE_SERVICE_IMAGE:-sentinel-inference-service:latest}
    container_name: sentinel-inference-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8011:8011"
    environment:
      INTERNAL_SERVICES_KEY: ${INTERNAL_SERVICES_KEY:-}
      ENV: production
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8011/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  decision-service:
    image: ${DECISION_SERVICE_IMAGE:-sentinel-decision-service:latest}
    container_name: sentinel-decision-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      INTERNAL_SERVICES_KEY: ${INTERNAL_SERVICES_KEY:-}
      ENV: production
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8012/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nlg-service:
    image: ${NLG_SERVICE_IMAGE:-sentinel-nlg-service:latest}
    container_name: sentinel-nlg-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8013:8013"
    environment:
      INTERNAL_SERVICES_KEY: ${INTERNAL_SERVICES_KEY:-}
      ENV: production
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8013/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: sentinel-gateway
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION}
      REDIS_URL: ${REDIS_URL}
      ENV: production
    volumes:
      - ./whatsapp_gateway:/app/whatsapp_gateway
      - ./shared:/app/shared
    networks:
      - sentinel-network
    command: uvicorn whatsapp_gateway.app.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8002/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============ FRONTEND (medical-agenda-saas) ============

  frontend:
    build:
      context: ./medical-agenda-saas
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${FRONTEND_DATABASE_URL:-postgresql://sentinel:sentinel_password@postgres:5432/sentinel_health}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-at-least-32-chars}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-24}
      NEXT_TELEMETRY_DISABLED: "1"
      BRAIN_API_URL: http://brain:8001
      BRAIN_API_KEY: ${BRAIN_API_KEY:-change-me-brain-key}
      BRAIN_TIMEOUT_MS: "5000"
      REDIS_URL: redis://redis-master:6379
      WHATSAPP_AUTO_BOOT_WORKERS: "false"
      DOCUMENT_AI_ENABLED: ${DOCUMENT_AI_ENABLED:-false}
      DOCUMENT_AI_PROVIDER: ${DOCUMENT_AI_PROVIDER:-groq}
      DOCUMENT_AI_BASE_URL: ${DOCUMENT_AI_BASE_URL:-https://api.groq.com/openai/v1}
    depends_on:
      - postgres
      - redis-master
    networks:
      - sentinel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

