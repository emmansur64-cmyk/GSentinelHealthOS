  #     - ./n8n/workflows:/home/node/.n8n/workflows
  #   networks:
  #     - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres_data:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  redis_cache_data:
  redis_metrics_data:
  # n8n_data:
