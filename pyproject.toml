[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "external-clinical-kernel"
version = "0.0.0"
description = "ClinicalKernel externo - fase 0 de arquitectura"
requires-python = ">=3.12"
dependencies = ["cryptography>=45,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
