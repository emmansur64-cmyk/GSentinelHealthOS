services:
  # IMPORTANTE: No usar 6379 en host. Ese puerto está ocupado por sentinel-redis-master.
  # Usar únicamente puertos alternativos (6380 o superior) vía REDIS_HOST_PORT.
  redis:
    image: redis:7-alpine
    container_name: medical-agenda-redis
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - medical-agenda-net

  # IMPORTANTE: No usar 5432 en host. Ese puerto está ocupado por sentinel-postgres.
  # Usar únicamente puertos alternativos (55432) vía POSTGRES_HOST_PORT.
  postgres:
    image: postgres:16-alpine
    container_name: medical-agenda-postgres
    environment:
      POSTGRES_DB: medical_agenda
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - medical_agenda_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d medical_agenda"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - medical-agenda-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: bootstrap
    container_name: medical-agenda-bootstrap
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medical_agenda
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SEED_SECRETARIA_NAME: ${SEED_SECRETARIA_NAME:-Secretaria Principal}
      SEED_SECRETARIA_EMAIL: ${SEED_SECRETARIA_EMAIL:-secretaria@clinic.local}
      SEED_SECRETARIA_PASSWORD: ${SEED_SECRETARIA_PASSWORD}
      SEED_DOCTOR_NAME: ${SEED_DOCTOR_NAME:-Dr. Inicial}
      SEED_DOCTOR_EMAIL: ${SEED_DOCTOR_EMAIL:-doctor@clinic.local}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD}
      SEED_DOCTOR_SPECIALTY: ${SEED_DOCTOR_SPECIALTY:-Medicina General}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -lc "npm run prisma:generate && npm run prisma:deploy && npm run prisma:seed"
    restart: "no"
    networks:
      - medical-agenda-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: medical-agenda-web
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medical_agenda
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-24}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
      NEXT_PUBLIC_META_OAUTH_REDIRECT_URI: ${NEXT_PUBLIC_META_OAUTH_REDIRECT_URI:-}
      NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIGURATION_ID: ${NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIGURATION_ID:-}
      GROQ_IMAGE_ANALYSIS_API_KEY: ${GROQ_IMAGE_ANALYSIS_API_KEY:-}
      GROQ_IMAGE_ANALYSIS_BASE_URL: ${GROQ_IMAGE_ANALYSIS_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_IMAGE_ANALYSIS_MODEL: ${GROQ_IMAGE_ANALYSIS_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      GROQ_IMAGE_ANALYSIS_MAX_MB: ${GROQ_IMAGE_ANALYSIS_MAX_MB:-10}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.HOSTNAME+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - medical-agenda-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  appointment-lifecycle:
    build:
      context: .
      dockerfile: Dockerfile
      target: bootstrap
    container_name: medical-agenda-lifecycle
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/medical_agenda
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      APPOINTMENT_REMINDER_LOOKAHEAD_HOURS: ${APPOINTMENT_REMINDER_LOOKAHEAD_HOURS:-24}
      APPOINTMENT_CONFIRMATION_CANCEL_HOURS_BEFORE: ${APPOINTMENT_CONFIRMATION_CANCEL_HOURS_BEFORE:-12}
      APPOINTMENT_LIFECYCLE_INTERVAL_MINUTES: ${APPOINTMENT_LIFECYCLE_INTERVAL_MINUTES:-60}
    command: ["npm", "run", "job:appointment-lifecycle:watch"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - medical-agenda-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  medical-agenda-net:
    driver: bridge

volumes:
  medical_agenda_postgres_data:
