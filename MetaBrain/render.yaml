services:
  - type: web
    name: metabrain-gateway
    env: docker
    dockerfilePath: docker/Dockerfile.gateway
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NLG_GROQ_ENABLED
        value: true
      - key: NLG_GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: NLG_GROQ_TEMPERATURE
        value: 0.2

  - type: worker
    name: metabrain-worker
    env: docker
    dockerfilePath: docker/Dockerfile.worker
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NLG_GROQ_ENABLED
        value: true
      - key: NLG_GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: NLG_GROQ_TEMPERATURE
        value: 0.2
