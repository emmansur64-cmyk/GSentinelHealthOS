apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: metabrain
  labels:
    app: ml-service
    component: ml
spec:
  selector:
    app: ml-service
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-registry-config
  namespace: metabrain
data:
  model-registry.json: |
    {
      "versions": [
        {
          "version": "1.0.0",
          "path": "models/incident-classifier-v1.0.0.onnx",
          "status": "production",
          "createdAt": "2024-01-15T10:00:00Z",
          "metadata": {
            "inputShape": [1, 10],
            "outputShape": [1, 3],
            "classes": ["restart_postgres", "retry_with_backoff", "clear_cache"],
            "accuracy": 0.92,
            "framework": "onnx"
          }
        }
      ],
      "lastUpdated": "2024-01-15T10:00:00Z"
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: metabrain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard