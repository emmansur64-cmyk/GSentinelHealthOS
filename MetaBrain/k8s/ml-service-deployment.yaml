apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: metabrain
  labels:
    app: ml-service
    component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        component: ml
    spec:
      containers:
      - name: ml-service
        image: metabrain/ml-service:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: METABRAIN_SHADOW_MODE
          value: "false"
        volumeMounts:
        - name: model-storage
          mountPath: /app/data/models
          readOnly: true
        - name: registry-storage
          mountPath: /app/data/model-registry.json
          subPath: model-registry.json
          readOnly: true
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /ml/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ml/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: ml-models-pvc
      - name: registry-storage
        configMap:
          name: ml-registry-config