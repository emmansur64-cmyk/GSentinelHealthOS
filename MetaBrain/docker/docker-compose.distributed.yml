services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.distributed
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - CEREBRO_API_KEY=${CEREBRO_API_KEY}
      - CEREBRO_CORS_ALLOW_ORIGINS=http://localhost:3000
      - CEREBRO_REDIS_URL=redis://redis:6379/0
      - CEREBRO_RATE_LIMIT_ENABLED=true
      - CEREBRO_RATE_LIMIT_FAIL_OPEN=false
      - INFERENCE_SERVICE_URL=http://inference-service:8001
      - DECISION_SERVICE_URL=http://decision-service:8002
      - DIALOGUE_SERVICE_URL=http://dialogue-service:8005
      - NLG_SERVICE_URL=http://nlg-service:8003
      - CEREBRO_INTERNAL_TIMEOUT_SECONDS=4
      - CEREBRO_INTERNAL_RETRIES=2
      - CEREBRO_INTERNAL_RETRY_BACKOFF_SECONDS=0.25
      - CEREBRO_ASYNC_ENABLED=true
      - CEREBRO_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - CEREBRO_ASYNC_QUEUE=cerebro.analyze.requests
      - CEREBRO_ASYNC_RESULT_TTL_SECONDS=600
      - CEREBRO_MEMORY_HISTORY_PATH=/var/lib/cerebro/memory/history.jsonl
    volumes:
      - memory_history_data:/var/lib/cerebro/memory
    depends_on:
      - redis
      - inference-service
      - decision-service
      - dialogue-service
      - nlg-service
      - rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  inference-service:
    build:
      context: ..
      dockerfile: services/inference_service/Dockerfile
    command: ["uvicorn", "services.inference_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    expose:
      - "8001"
    volumes:
      - ../cerebro_ai_med/models/artifacts:/app/cerebro_ai_med/models/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  decision-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.distributed
    command: ["uvicorn", "services.decision_service.main:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    expose:
      - "8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nlg-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.distributed
    command: ["uvicorn", "services.nlg_service.main:app", "--host", "0.0.0.0", "--port", "8003", "--workers", "1"]
    expose:
      - "8003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dialogue-service:
    build:
      context: ..
      dockerfile: services/dialogue_engine/Dockerfile
    command: ["uvicorn", "services.dialogue_engine.main:app", "--host", "0.0.0.0", "--port", "8005", "--workers", "1"]
    expose:
      - "8005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data_distributed:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  orchestrator-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.distributed
    command: ["python", "-m", "services.api_gateway.worker"]
    environment:
      - CEREBRO_ASYNC_ENABLED=true
      - CEREBRO_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - CEREBRO_ASYNC_QUEUE=cerebro.analyze.requests
      - CEREBRO_ASYNC_RESULT_TTL_SECONDS=600
      - CEREBRO_REDIS_URL=redis://redis:6379/0
      - INFERENCE_SERVICE_URL=http://inference-service:8001
      - DECISION_SERVICE_URL=http://decision-service:8002
      - DIALOGUE_SERVICE_URL=http://dialogue-service:8005
      - NLG_SERVICE_URL=http://nlg-service:8003
      - CEREBRO_INTERNAL_TIMEOUT_SECONDS=4
      - CEREBRO_INTERNAL_RETRIES=2
      - CEREBRO_INTERNAL_RETRY_BACKOFF_SECONDS=0.25
      - CEREBRO_MEMORY_HISTORY_PATH=/var/lib/cerebro/memory/history.jsonl
    volumes:
      - memory_history_data:/var/lib/cerebro/memory
    depends_on:
      - rabbitmq
      - redis
      - inference-service
      - decision-service
      - dialogue-service
      - nlg-service
    restart: unless-stopped

volumes:
  redis_data_distributed:
  memory_history_data:
