version: '3.8'

services:
  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml-service
    container_name: metabrain-ml-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - METABRAIN_SHADOW_MODE=false
    volumes:
      - ../data/models:/app/data/models:ro
      - ../data/model-registry.json:/app/data/model-registry.json:ro
    networks:
      - metabrain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/ml/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  metabrain-network:
    driver: bridge
    name: metabrain-network