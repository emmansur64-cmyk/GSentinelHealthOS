[pytest]
# Configuración de pytest para GSentinelHealthOS

# Rutas de búsqueda de tests
testpaths = tests

# Patrones de archivo de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    unit: Test unitario
    integration: Test de integración
    e2e: Test end-to-end
    slow: Test lento
    requires_db: Requiere base de datos

# Minimum Python version
minversion = 7.0
