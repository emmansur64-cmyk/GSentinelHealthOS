name: Auth Cookie Session Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  auth-cookie-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run auth cookie session tests
        run: |
          tox -e py312-auth-cookie
