name: Outbox Reliability Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  outbox-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run outbox reliability tests
        run: |
          tox -e py311-outbox
