name: Buffer Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  buffer-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run buffer QA smoke script
        run: |
          python scripts/qa_validate_buffers.py

      - name: Run buffer pytest suite
        run: |
          pytest tests/unit/test_buffer_validation_suite.py -q