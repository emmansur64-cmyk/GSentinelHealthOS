[tox]
envlist = py311-outbox, py312-outbox, py313-outbox, py312-observability, py313-observability, py312-auth-cookie
isolated_build = false

[testenv]
description = Run selected test suite under pinned Python runtime
package = skip
deps =
    -rrequirements.txt
    pytest==7.4.3
    pytest-asyncio==0.21.1
commands =
    python -m pytest {posargs}

[testenv:py311-outbox]
description = Run outbox reliability integration tests on Python 3.11
basepython = python3.11
commands =
    python -m pytest tests/integration/test_outbox_reliability.py -q

[testenv:py312-outbox]
description = Run outbox reliability integration tests on Python 3.12
basepython = python3.12
commands =
    python -m pytest tests/integration/test_outbox_reliability.py -q

[testenv:py313-outbox]
description = Run outbox reliability integration tests on Python 3.13
basepython = python3.13
commands =
    python -m pytest tests/integration/test_outbox_reliability.py -q

[testenv:py312-observability]
description = Run isolated observability tests on Python 3.12
basepython = python3.12
commands =
    python -m pytest tests/unit/test_health_observability.py -q

[testenv:py313-observability]
description = Run isolated observability tests on Python 3.13
basepython = python3.13
commands =
    python -m pytest tests/unit/test_health_observability.py -q

[testenv:py312-auth-cookie]
description = Run auth cookie session integration flow on Python 3.12
basepython = python3.12
deps =
    {[testenv]deps}
    PyJWT==2.10.1
commands =
    python -m pytest tests/integration/test_auth_cookie_session.py -q
